<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-label="Conversor de Arquivos">
  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="70%">
      <stop offset="0%" stop-color="#111d35"/>
      <stop offset="70%" stop-color="#08111f"/>
      <stop offset="100%" stop-color="#050b14"/>
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#13223d"/>
      <stop offset="100%" stop-color="#0b1425"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7ce4ff"/>
      <stop offset="45%" stop-color="#41adff"/>
      <stop offset="100%" stop-color="#2877ff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1000" height="1000" fill="url(#bg)"/>
  <rect x="220" y="220" width="560" height="560" rx="112" fill="url(#tile)" stroke="#4b7fd7" stroke-width="4" filter="url(#soft)"/>
  <g fill="url(#arrow)" filter="url(#glow)">
    <path d="M365 385 H570 V342 H605 V360 H630 V378 H655 V396 H680 V414 H705 V432 H680 V450 H655 V468 H630 V486 H605 V504 H570 V461 H365 Z"/>
    <path d="M635 539 H430 V496 H395 V514 H370 V532 H345 V550 H320 V568 H295 V586 H320 V604 H345 V622 H370 V640 H395 V658 H430 V615 H635 Z"/>
  </g>
</svg>